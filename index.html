<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Personal | FJAT Mecanindustria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        /* ============================================
           FJAT MECANINDUSTRIA — Login Design System
           Industrial dark theme, consistent with dashboard
           ============================================ */

        :root {
            --brand: #fe5126;
            --brand-hover: #e84720;
            --brand-subtle: rgba(254, 81, 38, 0.12);
            --brand-glow: rgba(254, 81, 38, 0.25);

            --accent: #4a6cf7;
            --accent-subtle: rgba(74, 108, 247, 0.12);

            --surface-base: #1a1c26;
            --surface-raised: #232632;
            --surface-overlay: #2a2d3a;
            --surface-hover: #2f3340;

            --fg-primary: #e8ecf4;
            --fg-secondary: #94a3b8;
            --fg-tertiary: #64748b;
            --fg-muted: #475569;

            --border-subtle: rgba(255, 255, 255, 0.04);
            --border-default: rgba(255, 255, 255, 0.07);
            --border-medium: rgba(255, 255, 255, 0.12);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;

            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;
            --space-2xl: 32px;
            --space-3xl: 40px;

            --ease-out: cubic-bezier(0.25, 0.1, 0.25, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--surface-base);
            color: var(--fg-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 4px; }

        /* --- Login Card --- */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: var(--space-xl);
            animation: fadeUp 0.8s var(--ease-out) forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: var(--surface-raised);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-2xl);
            padding: var(--space-3xl) var(--space-2xl);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* --- Logo --- */
        .logo-section {
            display: flex;
            align-items: center;
            gap: var(--space-lg);
            margin-bottom: var(--space-2xl);
        }
        .logo-section img {
            width: 44px;
            height: 44px;
            object-fit: contain;
        }
        .logo-divider {
            width: 1px;
            height: 36px;
            background: var(--border-medium);
        }
        .logo-text h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .logo-text p {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--brand);
            margin-top: 2px;
        }

        /* --- Greeting --- */
        .greeting h2 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: var(--space-sm);
        }
        .greeting p {
            color: var(--fg-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: var(--space-2xl);
        }

        /* --- Inputs --- */
        .input-group {
            margin-bottom: var(--space-xl);
        }
        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--fg-tertiary);
            margin-bottom: var(--space-sm);
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            transition: border-color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
        }
        .input-wrapper:focus-within {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px var(--brand-subtle);
        }
        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--fg-tertiary);
            flex-shrink: 0;
            pointer-events: none;
            transition: color 0.2s var(--ease-out);
        }
        .input-wrapper:focus-within .input-icon {
            color: var(--brand);
        }
        .input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 13px 14px 13px 42px;
            color: var(--fg-primary);
            font-size: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .input-wrapper input::placeholder {
            color: var(--fg-muted);
            font-size: 13px;
        }
        .input-wrapper input:-webkit-autofill,
        .input-wrapper input:-webkit-autofill:hover,
        .input-wrapper input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--fg-primary);
            -webkit-box-shadow: 0 0 0px 1000px rgba(0,0,0,0.3) inset;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* --- Toggle Password --- */
        .toggle-pwd {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            color: var(--fg-tertiary);
            transition: all 0.2s var(--ease-out);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-pwd:hover {
            color: var(--brand);
            background: var(--brand-subtle);
        }
        .toggle-pwd svg {
            width: 18px;
            height: 18px;
        }

        /* --- Checkbox (custom) --- */
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-xl);
        }
        .checkbox-row input[type="checkbox"] {
            display: none;
        }
        .checkbox-row .check-box {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-medium);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s var(--ease-out);
            flex-shrink: 0;
        }
        .checkbox-row input[type="checkbox"]:checked + .check-box {
            background: var(--brand);
            border-color: var(--brand);
        }
        .checkbox-row .check-box svg {
            width: 12px;
            height: 12px;
            opacity: 0;
            transition: opacity 0.2s var(--ease-out);
            color: white;
        }
        .checkbox-row input[type="checkbox"]:checked + .check-box svg {
            opacity: 1;
        }
        .checkbox-row label {
            font-size: 13px;
            color: var(--fg-secondary);
            cursor: pointer;
            user-select: none;
        }

        /* --- Button --- */
        .btn-submit {
            width: 100%;
            background: var(--brand);
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s var(--ease-out);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            position: relative;
            overflow: hidden;
        }
        .btn-submit:hover {
            background: var(--brand-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px var(--brand-glow);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .btn-submit:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .btn-submit .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .btn-submit.loading .btn-text { display: none; }
        .btn-submit.loading .spinner { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Forgot link --- */
        .forgot-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: var(--space-xl);
            margin-top: -8px;
        }
        .forgot-row a {
            font-size: 12px;
            color: var(--fg-tertiary);
            text-decoration: none;
            transition: color 0.2s var(--ease-out);
        }
        .forgot-row a:hover {
            color: var(--brand);
        }
        .forgot-row a span {
            color: var(--fg-secondary);
            font-weight: 600;
        }
        .forgot-row a:hover span {
            color: var(--brand);
        }

        /* --- Message --- */
        #message {
            margin-top: var(--space-lg);
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            display: none;
            text-align: center;
        }
        #message.show { display: block; }
        #message.success {
            background: rgba(34, 197, 94, 0.08);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.15);
        }
        #message.error {
            background: rgba(239, 68, 68, 0.08);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.15);
        }

        /* --- Footer --- */
        .login-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--space-lg);
            margin-top: var(--space-xl);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--border-subtle);
        }
        .login-footer span,
        .login-footer a {
            font-size: 10px;
            color: var(--fg-muted);
            text-decoration: none;
            transition: color 0.2s var(--ease-out);
        }
        .login-footer a:hover { color: var(--fg-tertiary); }
        .login-footer .workspace-badge {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: var(--space-lg);
            opacity: 0.4;
            font-size: 10px;
            font-weight: 700;
            color: var(--fg-tertiary);
            letter-spacing: 0.04em;
        }

        /* --- Error shake animation --- */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.4s var(--ease-out); }

        /* --- Responsive --- */
        @media (max-width: 480px) {
            .login-container { padding: var(--space-lg); }
            .login-card { padding: var(--space-2xl) var(--space-xl); border-radius: var(--radius-xl); }
            .greeting h2 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- Three.js Background -->
    <div id="three-bg" style="position: fixed; inset: 0; z-index: 0;"></div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">

            <!-- Logo -->
            <div class="logo-section">
                <img src="1sdas.png" alt="FJAT Logo">
                <div class="logo-divider"></div>
                <div class="logo-text">
                    <h1>FJAT</h1>
                    <p>Mecanindustria</p>
                </div>
            </div>

            <!-- Greeting -->
            <div class="greeting">
                <h2>Bienvenido</h2>
                <p>Ingresa tus credenciales para acceder al panel de control</p>
            </div>

            <!-- Form -->
            <form id="loginForm">
                <!-- Username -->
                <div class="input-group">
                    <label for="username">Usuario / Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"></path>
                        </svg>
                        <input type="text" id="username" required placeholder="Usuario de acceso" autocomplete="username">
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        <input type="password" id="password" required placeholder="Introduce la contraseña" autocomplete="current-password">
                        <button type="button" id="togglePassword" class="toggle-pwd" tabindex="-1" aria-label="Mostrar contraseña">
                            <svg id="eyeIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Forgot password -->
                <div class="forgot-row">
                    <a href="#">¿No recuerdas tus credenciales? <span>Recupéralas →</span></a>
                </div>

                <!-- Remember me -->
                <div class="checkbox-row">
                    <input type="checkbox" id="remember">
                    <label for="remember" class="check-box">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </label>
                    <label for="remember">Recordar acceso</label>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">Acceder al Panel</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <!-- Message -->
            <div id="message"></div>

            <!-- Footer -->
            <div class="login-footer">
                <span>© 2026 FJAT Mecanindustria S.A.C.</span>
                <a href="#">Soporte</a>
                <a href="#">Privacidad</a>
                <div class="workspace-badge">
                    <span>workspace</span>
                    <span class="italic">tesis</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js Script -->
    <script type="module">
        import * as THREE from 'three';

        const bgContainer = document.getElementById('three-bg');
        if (!bgContainer) return;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1c26);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 20;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        bgContainer.appendChild(renderer.domElement);

        // Particles
        const particleCount = 400;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const primaryColor = new THREE.Color(0xfe5126);
        const accentColor = new THREE.Color(0x4a6cf7);

        for (let i = 0; i < particleCount; i++) {
            positions[i*3] = (Math.random() - 0.5) * 50;
            positions[i*3+1] = (Math.random() - 0.5) * 40;
            positions[i*3+2] = (Math.random() - 0.5) * 30;
            const c = primaryColor.clone().lerp(accentColor, Math.random());
            colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
        }

        const particleGeo = new THREE.BufferGeometry();
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particles = new THREE.Points(
            particleGeo,
            new THREE.PointsMaterial({
                size: 0.12, vertexColors: true, transparent: true,
                opacity: 0.6, blending: THREE.AdditiveBlending, sizeAttenuation: true
            })
        );
        scene.add(particles);

        // Floaty geometric shapes
        const shapes = [];
        const shapeColors = [0xfe5126, 0x4a6cf7, 0xff8c6b, 0x6c5ce7];
        const geos = [
            new THREE.TorusKnotGeometry(0.5, 0.18, 48, 6),
            new THREE.OctahedronGeometry(0.6),
            new THREE.IcosahedronGeometry(0.5),
            new THREE.TorusGeometry(0.45, 0.18, 12, 24),
        ];

        for (let i = 0; i < 8; i++) {
            const mesh = new THREE.Mesh(geos[i % geos.length], new THREE.MeshPhysicalMaterial({
                color: shapeColors[i % shapeColors.length],
                metalness: 0.3, roughness: 0.5, transparent: true,
                opacity: 0.1 + Math.random() * 0.12,
                wireframe: Math.random() > 0.5
            }));
            mesh.position.set((Math.random() - 0.5) * 35, (Math.random() - 0.5) * 25, (Math.random() - 0.5) * 20 - 3);
            mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            mesh.userData = {
                rotSpeed: (Math.random() - 0.5) * 0.008,
                floatSpeed: 0.15 + Math.random() * 0.25,
                floatAmt: 0.2 + Math.random() * 0.4,
                baseY: mesh.position.y
            };
            scene.add(mesh);
            shapes.push(mesh);
        }

        // Mouse parallax
        const mouse = { x: 0, y: 0 }, target = { x: 0, y: 0 };
        document.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const t = performance.now() / 1000;

            target.x += (mouse.x - target.x) * 0.02;
            target.y += (mouse.y - target.y) * 0.02;

            camera.position.x += (target.x * 1.2 - camera.position.x) * 0.01;
            camera.position.y += (target.y * 0.8 - camera.position.y) * 0.01;
            camera.lookAt(0, 0, 0);

            particles.rotation.y = t * 0.025;
            particles.rotation.x = Math.sin(t * 0.008) * 0.04;

            shapes.forEach((mesh, i) => {
                mesh.rotation.x += mesh.userData.rotSpeed * 1.5;
                mesh.rotation.y += mesh.userData.rotSpeed;
                mesh.position.y = mesh.userData.baseY + Math.sin(t * mesh.userData.floatSpeed + i * 1.5) * mesh.userData.floatAmt;
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>

    <!-- App Script -->
    <script>
        // --- Password Toggle ---
        const toggleBtn = document.getElementById('togglePassword');
        const pwdInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = pwdInput.type === 'password';
            pwdInput.type = isPassword ? 'text' : 'password';
            eyeIcon.innerHTML = isPassword
                ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>'
                : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
        });

        // --- Login Form ---
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const msgDiv = document.getElementById('message');
        const usernameInput = document.getElementById('username');
        const pwdWrapper = pwdInput.closest('.input-wrapper');

        function showMessage(text, type) {
            msgDiv.textContent = text;
            msgDiv.className = 'show ' + type;
            msgDiv.style.display = '';
            if (type === 'error') {
                pwdWrapper.classList.add('shake');
                setTimeout(() => pwdWrapper.classList.remove('shake'), 500);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msgDiv.className = '';
            msgDiv.style.display = 'none';
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: pwdInput.value
                    })
                });
                const data = await res.json();

                if (data.success) {
                    showMessage(`Bienvenido${data.user?.name ? ' ' + data.user.name : ''}. Redirigiendo...`, 'success');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
                } else {
                    showMessage('Credenciales incorrectas. Intenta de nuevo.', 'error');
                    pwdInput.value = '';
                    pwdInput.focus();
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            } catch (err) {
                showMessage('Error al conectar con el servidor.', 'error');
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
